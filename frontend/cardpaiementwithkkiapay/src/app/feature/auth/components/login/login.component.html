<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">TestingKKIAPAYCardPaiement</div>
      <div class="sub">Accédez à votre espace</div>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="vous@exemple.com"
        formControlName="email"
        [class.error]="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
      />
      <div
        *ngIf="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
        class="error-message"
      >
        Veuillez entrer un email valide
      </div>

      <label for="password">Mot de passe</label>
      <div class="input-group">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          formControlName="password"
          [class.error]="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
          "
        />
        <button
          class="icon-btn"
          type="button"
          [attr.data-state]="showPassword ? 'on' : 'off'"
          aria-label="Afficher/masquer le mot de passe"
          title="Afficher/Masquer"
          (click)="togglePasswordVisibility()"
        >
          <svg
            class="eye"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M12 5C7 5 3 12 3 12s4 7 9 7 9-7 9-7-4-7-9-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
            />
          </svg>
          <svg
            class="eye-off"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M2 12s4.5-7 10-7c.9 0 1.8.14 2.64.4l-1.6 1.6A5 5 0 0 0 7 12a5 5 0 0 0 6.99 4.56l1.6 1.6A10.9 10.9 0 0 1 12 19c-5.5 0-10-7-10-7Zm20 0s-1.1 1.78-2.86 3.47L19 15.33C20.71 13.7 22 12 22 12ZM4.41 3.99 3 5.4l4.2 4.2A5 5 0 0 0 7 12a5 5 0 0 0 5 5c.56 0 1.1-.1 1.6-.27l3 3 1.41-1.41-13.6-13.6Z"
            />
          </svg>
        </button>
      </div>
      <div
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
        class="error-message"
      >
        Le mot de passe doit contenir au moins 6 caractères
      </div>

      <div *ngIf="errorMessage" class="error-message global-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="isLoading">Connexion...</span>
        <span *ngIf="!isLoading">Se connecter</span>
      </button>
    </form>
    <p class="muted">Pas de compte ? <a href="/register">Créer un compte</a></p>
    <p class="disclaimer">
      Plateforme créée à des fins de tests pour l’intégration du paiement
      Kkiapay. Non destinée à un usage commercial.
    </p>
  </div>
  <div class="grain"></div>
</div>
