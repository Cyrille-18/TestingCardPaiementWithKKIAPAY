<div class="product-page">
  <!-- Navbar -->
  <app-navbar [user]="currentUser" (logout)="logout()"></app-navbar>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <section class="header-section">
        <h1 class="main-title">Produit</h1>
        <p class="main-subtitle">Choisissez une option pour continuer</p>
      </section>

      <section class="options-section">
        <div class="options-grid">
          <button
            class="option-card"
            [class.selected]="selectedOption === 'buy'"
            (click)="selectOption('buy')"
          >
            <div class="option-icon buy">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 6h15l-1.5 9H7.5L6 6z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="9"
                  cy="20"
                  r="1.5"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <circle
                  cx="18"
                  cy="20"
                  r="1.5"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
            <div class="option-content">
              <h3 class="option-title">Acheter un produit</h3>
              <p class="option-text">Paiement unique immédiat</p>
            </div>
          </button>

          <button
            class="option-card"
            [class.selected]="selectedOption === 'subscribe'"
            (click)="selectOption('subscribe')"
          >
            <div class="option-icon subscribe">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 7h16M4 12h16M4 17h16"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="option-content">
              <h3 class="option-title">Souscrire à un paiement</h3>
              <p class="option-text">Abonnement récurrent</p>
            </div>
          </button>
        </div>
        <div class="continue-section">
          <button
            class="continue-btn"
            [class.disabled]="!selectedOption"
            [disabled]="!selectedOption"
            (click)="continue()"
          >
            Continuer
          </button>
          <p class="continue-hint" *ngIf="!selectedOption">
            Sélectionnez une option pour continuer
          </p>
        </div>
      </section>
    </div>
  </main>

  <div class="grain"></div>
</div>
